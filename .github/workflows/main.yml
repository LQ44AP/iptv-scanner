name: Build IPTV Scan Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '23.05.6'
            format: 'ipk'
            sdk_url: 'https://downloads.openwrt.org/releases/23.05.6/targets/x86/64/openwrt-sdk-23.05.6-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz'
            sdk_ext: 'xz'
          # ⚠️ 25.12.5 目前不存在，请替换为实际版本；下面示例用 24.10.0
          - version: '24.10.0'
            format: 'apk'
            sdk_url: 'https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst'
            sdk_ext: 'zst'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Download OpenWrt SDK
        run: |
          set -e
          wget -q -O sdk.tar.${{ matrix.sdk_ext }} "${{ matrix.sdk_url }}"
          mkdir -p sdk
          if [ "${{ matrix.sdk_ext }}" = "zst" ]; then
            tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          else
            tar -xJf sdk.tar.xz -C sdk --strip-components=1
          fi

      - name: Copy package sources into SDK
        run: |
          set -e
          # ✅ 直接把两个包目录整体拷入，不要嵌套，不要重命名
          cp -r ./iptv-scanner          sdk/package/iptv-scanner
          cp -r ./luci-app-iptv-scanner sdk/package/luci-app-iptv-scanner
          echo "=== package dir ==="
          ls -la sdk/package/

      - name: Update and install feeds
        working-directory: sdk
        run: |
          set -e
          ./scripts/feeds update -a
          # luci feed 需要安装完整，否则 luci.mk 宏缺失
          ./scripts/feeds install -a -p luci || ./scripts/feeds install -a
          ./scripts/feeds install luci-base rpcd rpcd-mod-file libpcap

      - name: Configure
        working-directory: sdk
        run: |
          set -e
          make defconfig

      - name: Build packages
        working-directory: sdk
        run: |
          set -e
          make package/iptv-scanner/compile           V=s
          make package/luci-app-iptv-scanner/compile  V=s

      - name: Collect packages
        run: |
          set -e
          mkdir -p dist
          # 递归找，两种格式都收
          find sdk/bin/packages -type f \
            \( -name 'iptv-scanner_*.ipk' \
               -o -name 'iptv-scanner-*.apk' \
               -o -name 'luci-app-iptv-scanner_*.ipk' \
               -o -name 'luci-app-iptv-scanner-*.apk' \) \
            -exec cp -v {} dist/ \;
          echo "=== collected ==="
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iptv-scan-${{ matrix.format }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "=== release files ==="
          find artifacts -type f -printf '%p\n'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.*pk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
