name: Build for Multiple Archs

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

env:
  OPENWRT_VERSION: "23.05.5"          # 可在此处统一修改 OpenWrt 版本

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: mipsel_24kc
            target: ramips
            subtarget: mt7621
          - arch: mips_24kc
            target: ath79
            subtarget: generic
          - arch: x86_64
            target: x86
            subtarget: 64
          - arch: aarch64_generic
            target: rockchip
            subtarget: armv8

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext \
            libssl-dev xsltproc wget unzip qemu-utils

      - name: Cache SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: openwrt-sdk
          key: sdk-${{ matrix.target }}-${{ matrix.subtarget }}-${{ env.OPENWRT_VERSION }}

      - name: Download SDK (if not cached)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/${{ env.OPENWRT_VERSION }}/targets/${{ matrix.target }}/${{ matrix.subtarget }}/"
          echo "Fetching SDK from: $SDK_URL"
          # 提取 SDK 文件名（适配 OpenWrt 官方列表格式）
          SDK_FILE=$(wget -qO- "$SDK_URL" | grep -oE 'openwrt-sdk-[^"]*Linux-x86_64\.tar\.xz' | head -n1)
          if [ -z "$SDK_FILE" ]; then
            echo "::error::Failed to find SDK file at $SDK_URL"
            exit 1
          fi
          echo "Downloading $SDK_FILE ..."
          wget -q "$SDK_URL$SDK_FILE"
          echo "Extracting SDK ..."
          tar -xf "$SDK_FILE" --one-top-level=openwrt-sdk --strip-components=1
          rm -f "$SDK_FILE"

      - name: Compile Package
        run: |
          cd openwrt-sdk
          # 将源代码链接到 SDK 的 package 目录
          mkdir -p package/iptv_scanner
          cp -r ../src ../Makefile package/iptv_scanner/

          # 更新 feeds 并安装依赖（libpcap）
          ./scripts/feeds update -a
          ./scripts/feeds install libpcap

          # 配置并编译
          make defconfig
          make package/iptv_scanner/compile V=s -j$(nproc)

      - name: Organize Artifacts
        run: |
          mkdir -p ./deploy
          # 直接复制原始 ipk 文件，保留版本号和架构信息
          find openwrt-sdk/bin/packages/${{ matrix.arch }}/ -name "iptv_scanner*.ipk" -exec cp {} ./deploy/ \;
          # 如果没有任何 ipk 生成，则报错
          if [ -z "$(ls -A ./deploy)" ]; then
            echo "::error::No ipk files were produced!"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iptv_scanner-${{ matrix.arch }}
          path: ./deploy/*.ipk

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true          # 将所有架构的 ipk 合并到同一目录

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/*.ipk
          body: |
            ## IPTV 扫描器多架构自动编译版本

            - OpenWrt 版本: ${{ env.OPENWRT_VERSION }}
            - 包含架构: mipsel_24kc, mips_24kc, x86_64, aarch64_generic

            如需其他架构请提交 Issue。
          generate_release_notes: false
