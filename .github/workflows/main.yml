name: Build for Multiple OpenWrt Versions (IPK & APK)

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [23.05.6, 25.12.5]
        arch:
          - { name: mipsel_24kc, target: ramips, subtarget: mt7621 }
          - { name: mips_24kc, target: ath79, subtarget: generic }
          - { name: x86_64, target: x86, subtarget: 64 }
          - { name: aarch64_generic, target: rockchip, subtarget: armv8 }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext \
            libssl-dev xsltproc wget unzip qemu-utils python3 file zstd tar

      - name: Set version-specific variables
        id: vars
        run: |
          VERSION="${{ matrix.version }}"
          if [[ "$VERSION" =~ ^25\. ]] || [[ "$VERSION" =~ ^main ]]; then
            echo "suffix=apk" >> $GITHUB_OUTPUT
            echo "ext=zst" >> $GITHUB_OUTPUT
            echo "sdk_pattern=openwrt-sdk-*.tar.zst" >> $GITHUB_OUTPUT
          else
            echo "suffix=ipk" >> $GITHUB_OUTPUT
            echo "ext=xz" >> $GITHUB_OUTPUT
            echo "sdk_pattern=openwrt-sdk-*.tar.xz" >> $GITHUB_OUTPUT
          fi

      - name: Download and Setup SDK
        run: |
          VERSION="${{ matrix.version }}"
          TARGET="${{ matrix.arch.target }}"
          SUBTARGET="${{ matrix.arch.subtarget }}"
          SDK_BASE="https://downloads.openwrt.org/releases/${VERSION}/targets/${TARGET}/${SUBTARGET}/"
          PATTERN="${{ steps.vars.outputs.sdk_pattern }}"

          wget -nv -r -l1 -nd -A "$PATTERN" -e robots=off "$SDK_BASE" || true
          SDK_FILE=$(ls $PATTERN 2>/dev/null | head -n 1)

          if [ -z "$SDK_FILE" ]; then
            echo "::error::No SDK file found at $SDK_BASE"
            exit 1
          fi

          EXT="${{ steps.vars.outputs.ext }}"
          if [ "$EXT" = "xz" ]; then
            tar -xJf "$SDK_FILE"
          elif [ "$EXT" = "zst" ]; then
            tar --zstd -xf "$SDK_FILE"
          fi

          SDK_DIR=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*" | head -n 1)
          if [ -z "$SDK_DIR" ]; then
            echo "::error::Failed to extract SDK"
            exit 1
          fi
          mv "$SDK_DIR" openwrt-sdk

      - name: Compile Package
        run: |
          cd openwrt-sdk
          ./scripts/feeds update -a
          ./scripts/feeds install libpcap

          mkdir -p package/iptv_scanner
          if [ -d "../src" ]; then cp -r ../src package/iptv_scanner/; fi
          cp ../Makefile package/iptv_scanner/

          echo "CONFIG_PACKAGE_iptv_scanner=y" >> .config
          make defconfig

          make package/iptv_scanner/compile V=s -j$(nproc)

      - name: Organize Artifacts
        run: |
          mkdir -p ./deploy
          SUFFIX="${{ steps.vars.outputs.suffix }}"
          ARCH_NAME="${{ matrix.arch.name }}"

          # 关键修改：从 openwrt-sdk/bin 根目录下全盘递归查找生成的包
          FILES=$(find openwrt-sdk/bin/ -type f \( -name "*.ipk" -o -name "*.apk" \))

          if [ -z "$FILES" ]; then
            echo "::error::No package files (.ipk or .apk) produced!"
            exit 1
          fi

          for FILE in $FILES; do
            FILENAME=$(basename "$FILE")
            
            # 如果是 apk 格式且文件名中尚未包含架构名称，则追加架构名
            if [[ "$FILENAME" == *.apk ]] && [[ "$FILENAME" != *"${ARCH_NAME}"* ]]; then
              BASE_NAME="${FILENAME%.*}"
              NEW_NAME="${BASE_NAME}_${ARCH_NAME}.apk"
              cp "$FILE" "./deploy/${NEW_NAME}"
              echo "Copied & Renamed APK: $FILENAME -> $NEW_NAME"
            else
              # ipk 默认自带架构名，直接复制
              cp "$FILE" ./deploy/
              echo "Copied Package: $FILENAME"
            fi
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          # 必须将 version 和 arch.name 结合命名，防止不同 matrix 任务相互覆盖 Artifact
          name: iptv_scanner-${{ matrix.version }}-${{ matrix.arch.name }}
          path: ./deploy/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-assets/*.ipk
            ./release-assets/*.apk
          body: |
            ## IPTV 扫描器多架构 / 多版本自动编译
          generate_release_notes: false
