name: Build for Multiple Archs (APK)

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: mipsel_24kc
            target: ramips
            subtarget: mt7621
          - arch: mips_24kc
            target: ath79
            subtarget: generic
          - arch: x86_64
            target: x86
            subtarget: 64
          - arch: aarch64_generic
            target: rockchip
            subtarget: armv8

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext \
            libssl-dev xsltproc wget unzip qemu-utils python3 file zstd

      - name: Download and Setup SDK (25.12.5)
        run: |
          VERSION="25.12.5"
          SDK_BASE="https://downloads.openwrt.org/releases/${VERSION}/targets/${{ matrix.target }}/${{ matrix.subtarget }}/"
          wget -nv -r -l1 -nd -A "openwrt-sdk-*.tar.zst" -e robots=off "$SDK_BASE" || true
          SDK_FILE=$(ls openwrt-sdk-*.tar.zst 2>/dev/null | head -n 1)
          if [ -z "$SDK_FILE" ]; then
            echo "::error::No SDK file found at $SDK_BASE"
            exit 1
          fi
          echo "SDK_FILE=$SDK_FILE" >> $GITHUB_ENV
          zstd -d "$SDK_FILE"
          TAR_FILE="${SDK_FILE%.zst}"
          tar -xf "$TAR_FILE"
          SDK_DIR=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*" | head -n 1)
          if [ -z "$SDK_DIR" ]; then
            echo "::error::Failed to extract SDK"
            exit 1
          fi
          mv "$SDK_DIR" openwrt-sdk

      - name: Compile Package
        run: |
          cd openwrt-sdk
          mkdir -p package/iptv_scanner
          cp -r ../src ../Makefile package/iptv_scanner/
          if [ ! -f package/iptv_scanner/Makefile ]; then
            echo "::error::Makefile not found in package/iptv_scanner/"
            exit 1
          fi

          # 更新 feeds（可选，但确保包依赖可用）
          ./scripts/feeds update -a

          # 启用您的包及其依赖 libpcap
          echo "CONFIG_PACKAGE_iptv_scanner=y" >> .config
          echo "CONFIG_PACKAGE_libpcap=y" >> .config

          make defconfig

          # 先编译依赖库 libpcap，确保头文件和库已就绪
          make package/libpcap/compile -j$(nproc)

          # 编译您的包
          make package/iptv_scanner/compile V=s -j$(nproc)

      - name: Organize Artifacts
        run: |
          mkdir -p ./deploy
          find openwrt-sdk/bin/packages/ -name "iptv_scanner*.apk" -exec cp {} ./deploy/ \;
          if [ -z "$(ls -A ./deploy)" ]; then
            echo "::error::No APK files produced!"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iptv_scanner-${{ matrix.arch }}
          path: ./deploy/*.apk

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/*.apk
          body: |
            ## IPTV 扫描器 APK 多架构自动编译版本
          generate_release_notes: false
