name: Build for Multiple Archs (APK)

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 小端序 MIPS (联发科路由)
          - arch: mipsel_24kc
            target: ramips
            subtarget: mt7621
          # 大端序 MIPS (高通/阿瑟罗路由)
          - arch: mips_24kc
            target: ath79
            subtarget: generic
          # x86-64 (软路由/虚拟机)
          - arch: x86_64
            target: x86
            subtarget: 64
          # ARM64 (树莓派4/5, NanoPi)
          - arch: aarch64_generic
            target: rockchip
            subtarget: armv8

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # 安装编译工具及 zstd（用于解压 .tar.zst）
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext \
            libssl-dev xsltproc wget unzip qemu-utils python3 file zstd

      - name: Download and Setup SDK (25.12.5)
        run: |
          VERSION="25.12.5"
          SDK_BASE="https://downloads.openwrt.org/releases/${VERSION}/targets/${{ matrix.target }}/${{ matrix.subtarget }}/"
          # 递归下载匹配的 SDK（仅获取 .tar.zst 文件）
          wget -nv -r -l1 -nd -A "openwrt-sdk-*.tar.zst" -e robots=off "$SDK_BASE" || true
          SDK_FILE=$(ls openwrt-sdk-*.tar.zst 2>/dev/null | head -n 1)
          if [ -z "$SDK_FILE" ]; then
            echo "::error::No SDK file found at $SDK_BASE"
            exit 1
          fi
          echo "SDK_FILE=$SDK_FILE" >> $GITHUB_ENV
          # tar 自动识别 .zst（需要 zstd 命令行工具）
          tar -xJf "$SDK_FILE"
          SDK_DIR=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*" | head -n 1)
          if [ -z "$SDK_DIR" ]; then
            echo "::error::Failed to extract SDK"
            exit 1
          fi
          mv "$SDK_DIR" openwrt-sdk

      - name: Compile Package
        run: |
          cd openwrt-sdk
          # 创建包目录并复制源码
          mkdir -p package/iptv_scanner
          cp -r ../src ../Makefile package/iptv_scanner/
          if [ ! -f package/iptv_scanner/Makefile ]; then
            echo "::error::Makefile not found in package/iptv_scanner/"
            exit 1
          fi

          # 更新 feeds（可能不需要，但保留以防依赖）
          ./scripts/feeds update -a
          # 启用包（确保包名与 Makefile 中定义的一致）
          echo "CONFIG_PACKAGE_iptv_scanner=y" >> .config
          make defconfig
          # 编译包（生成 APK）
          make package/iptv_scanner/compile V=s -j$(nproc)

      - name: Organize Artifacts
        run: |
          mkdir -p ./deploy
          # 搜索生成的 APK 文件（新版 OpenWrt 使用 .apk）
          find openwrt-sdk/bin/packages/ -name "iptv_scanner*.apk" -exec cp {} ./deploy/ \;
          if [ -z "$(ls -A ./deploy)" ]; then
            echo "::error::No APK files produced!"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iptv_scanner-${{ matrix.arch }}
          path: ./deploy/*.apk

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/*.apk
          body: |
            ## IPTV 扫描器 APK 多架构自动编译版本 (OpenWrt 25.12.5)
          generate_release_notes: false
